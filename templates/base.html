{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home Tasks{% endblock %}</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >
  <link
    rel="stylesheet"
    href="{% static 'homepage/css/style.css' %}"
  >
</head>
<body>
  <header class="site-header">
    <div class="container py-3 d-flex align-items-center gap-3">
      <img
        src="{% static 'homepage/img/logo.png' %}"
        alt="Home Tasks"
        class="home-tasks-logo"
      >
      <div>
        <p class="h4 mb-0">Home Tasks</p>
        <p class="text-muted mb-0">Сервис учета домашних дел</p>
      </div>
    </div>
    {% include "includes/navigation.html" %}
  </header>
  <main class="container py-4">
    {% block content %}
    {% endblock %}
  </main>
  <footer class="container mt-4 mb-3">
    <p>
      © <span id="current-year"></span> Home Tasks
    </p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
