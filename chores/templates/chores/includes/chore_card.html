<article class="card chore-card mb-3">
  <div class="card-body">
    <h2 class="card-title h5">
      {{ chore.title|default:"Без названия" }}
    </h2>
    <p class="card-text">
      Исполнитель: {{ chore.user.name }}
    </p>
    <p class="card-text">
      Категория: {{ chore.category.name }}
    </p>
    <p class="card-text">
      Срок: {{ chore.due_date|date:"Y-m-d" }}
    </p>
    <p class="card-text">
      {% include "chores/includes/chore_status.html" %}
    </p>
    <a
      href="{{ chore.get_absolute_url }}"
      class="btn btn-success me-2"
    >
      Подробнее
    </a>
    {% if not chore.is_done %}
      <a
        href="{% url 'chores:update' chore.pk %}"
        class="btn btn-outline-success me-2"
      >
        Изменить
      </a>
      <form
        method="post"
        action="{% url 'chores:complete' chore.pk %}"
        class="d-inline"
      >
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-secondary">
          Выполнено
        </button>
      </form>
    {% endif %}
  </div>
</article>
